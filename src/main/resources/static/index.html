<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD KTP - Tugas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body class="container mt-5">

<h2 class="mb-4">Manajemen Data KTP</h2>

<!-- FORM INPUT -->
<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title" id="formTitle">Tambah Data KTP</h5>
        <form id="ktpForm">
            <input type="hidden" id="ktpId">

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nomor KTP</label>
                    <input type="text" id="nomorKtp" class="form-control" maxlength="16" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="namaLengkap" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Alamat</label>
                    <input type="text" id="alamat" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Tanggal Lahir</label>
                    <input type="date" id="tanggalLahir" class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Jenis Kelamin</label>
                    <select id="jenisKelamin" class="form-select">
                        <option value="">Pilih...</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" id="btnSubmit" class="btn btn-primary me-2">Simpan</button>
                    <button type="button" id="btnCancel" class="btn btn-secondary" style="display:none;">Batal</button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- TABEL DATA KTP -->
<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nomor KTP</th>
        <th>Nama Lengkap</th>
        <th>Alamat</th>
        <th>Tanggal Lahir</th>
        <th>Jenis Kelamin</th>
        <th>Aksi</th>
    </tr>
    </thead>
    <tbody id="ktpTableBody">
    <!-- Data akan diisi oleh AJAX -->
    </tbody>
</table>

<script>
    const apiUrl = '/ktp';
    let isUpdate = false;

    $(document).ready(function() {
        loadKtp();
    });

    // Handle form submit
    $('#ktpForm').submit(function(e) {
        e.preventDefault();

        const ktpData = {
            nomorKtp: $('#nomorKtp').val(),
            namaLengkap: $('#namaLengkap').val(),
            alamat: $('#alamat').val(),
            tanggalLahir: $('#tanggalLahir').val(),
            jenisKelamin: $('#jenisKelamin').val()
        };

        if (isUpdate) {
            const id = $('#ktpId').val();
            updateKtp(id, ktpData);
        } else {
            addKtp(ktpData);
        }
    });

    // Reset form
    $('#btnCancel').click(function() {
        resetForm();
    });

    // GET ALL - Load data KTP
    function loadKtp() {
        $.get(apiUrl, function(response) {
            let rows = '';
            response.data.forEach(ktp => {
                rows += `
                        <tr>
                            <td>${ktp.id}</td>
                            <td>${ktp.nomorKtp}</td>
                            <td>${ktp.namaLengkap}</td>
                            <td>${ktp.alamat}</td>
                            <td>${ktp.tanggalLahir}</td>
                            <td>${ktp.jenisKelamin}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editKtp(${ktp.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteKtp(${ktp.id})">Hapus</button>
                            </td>
                        </tr>
                    `;
            });
            $('#ktpTableBody').html(rows);
        });
    }

    // POST - Tambah data
    function addKtp(data) {
        $.ajax({
            url: apiUrl,
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response.message);
                resetForm();
                loadKtp();
            },
            error: function(xhr) {
                alert('Error: ' + (xhr.responseJSON?.message || 'Gagal menambah data'));
            }
        });
    }

    // GET by ID - Untuk edit
    function editKtp(id) {
        $.get(`${apiUrl}/${id}`, function(response) {
            const ktp = response.data;
            $('#ktpId').val(ktp.id);
            $('#nomorKtp').val(ktp.nomorKtp);
            $('#namaLengkap').val(ktp.namaLengkap);
            $('#alamat').val(ktp.alamat);
            $('#tanggalLahir').val(ktp.tanggalLahir);
            $('#jenisKelamin').val(ktp.jenisKelamin);

            $('#formTitle').text('Edit Data KTP');
            $('#btnSubmit').text('Update').removeClass('btn-primary').addClass('btn-success');
            $('#btnCancel').show();
            isUpdate = true;
        });
    }

    // PUT - Update data
    function updateKtp(id, data) {
        $.ajax({
            url: `${apiUrl}/${id}`,
            type: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function(response) {
                alert(response.message);
                resetForm();
                loadKtp();
            },
            error: function(xhr) {
                alert('Error: ' + (xhr.responseJSON?.message || 'Gagal update data'));
            }
        });
    }

    // DELETE - Hapus data
    function deleteKtp(id) {
        if (confirm('Yakin ingin menghapus data KTP ini?')) {
            $.ajax({
                url: `${apiUrl}/${id}`,
                type: 'DELETE',
                success: function(response) {
                    alert(response.message);
                    loadKtp();
                },
                error: function(xhr) {
                    alert('Error: ' + (xhr.responseJSON?.message || 'Gagal hapus data'));
                }
            });
        }
    }

    // Reset form ke mode tambah
    function resetForm() {
        $('#ktpId').val('');
        $('#ktpForm')[0].reset();
        $('#formTitle').text('Tambah Data KTP');
        $('#btnSubmit').text('Simpan').removeClass('btn-success').addClass('btn-primary');
        $('#btnCancel').hide();
        isUpdate = false;
    }
</script>

</body>
</html>
